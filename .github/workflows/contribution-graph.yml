# Generates the contribution graph as an SVG committed to this repo's `output`
# branch, instead of hotlinking a third-party image service.
#
# The previous activity-graph host went permanently offline
# (DEPLOYMENT_DISABLED), taking the image with it, and every known mirror is
# dead too. Rendering the asset here means the README depends only on this
# repository.
name: Contribution graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
